name: Publish server
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NovaBeat.zip
      - working-directory: NovaBeat/server
        run: |
          git init -q -b server
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Nova Beat server"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" server
